; PlatformIO project configuration for ESP32-C3 Super Mini
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ESP32-C3 Super Mini uses the native USB port for serial (USB-CDC),
; these flags are required for Serial to work over the USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit AHTX0@^2.0.5
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
